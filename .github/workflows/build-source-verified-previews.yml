name: Build source-verified auction review previews
on:
  push:
    branches: [main]
    paths:
      - auctions/1879/review_requests.json
      - .github/workflows/build-source-verified-previews.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbitbid-metadata-writes
  cancel-in-progress: false

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pillow
      - name: Select requested lots directly from the current full snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("auctions/1879")
          original = json.loads((root/"lots.json").read_text(encoding="utf-8"))
          request = json.loads((root/"review_requests.json").read_text(encoding="utf-8"))
          required = list(map(str, request["lots"]))
          if len(original["lots"]) != 487 or original["total_discovered"] != 487:
              raise SystemExit("Not the verified complete 487-lot catalog")
          if len(set(required)) != len(required) or not required:
              raise SystemExit("Duplicate or empty requested lot list")
          def number(lot):
              return str(lot.get("requested_lot_number") or lot.get("item_number") or lot.get("id"))
          selected = [lot for lot in original["lots"] if number(lot) in required]
          if len(selected) != len(required):
              raise SystemExit("Missing requested lot from current source")
          if any(not lot.get("images") for lot in selected):
              raise SystemExit("Request includes catalog lot without images")
          original["lots"] = selected
          original["total_discovered"] = len(selected)
          original["total_errors"] = 0
          target = Path("auctions/review1879")
          target.mkdir(parents=True, exist_ok=True)
          (target/"lots.json").write_text(json.dumps(original), encoding="utf-8")
          print("Selected",len(selected),"current-snapshot lots")
          PY
      - name: Download only matching source photos
        run: python scripts/mirror_photos.py review1879
      - name: Build small contact sheets
        run: python scripts/build_contact_sheets.py review1879
      - name: Verify photos, lot IDs and source URL mapping
        run: python scripts/verify_photo_outputs.py review1879
      - name: Calculate auction-based temporary artifact retention
        id: retention
        shell: bash
        run: python scripts/photo_retention.py 1879 >> "$GITHUB_OUTPUT"
      - name: Upload temporary verified photos and per-lot review sheets
        if: steps.retention.outputs.expired != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orbitbid-1879-review-photos
          path: auctions/review1879/photos/
          retention-days: ${{ steps.retention.outputs.retention_days }}
          compression-level: 0
          if-no-files-found: error
      - name: Remove legacy committed review-preview images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -d auctions/1879/review-previews ]]; then
            git rm -r auctions/1879/review-previews
            git commit -m "Remove committed OrbitBid 1879 review images; use temporary artifacts"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
      - name: Summary
        run: |
          echo "Source-verified batch photos and review sheets are temporary Actions artifacts, not committed files." >> "$GITHUB_STEP_SUMMARY"
          echo "Cleanup after: ${{ steps.retention.outputs.cleanup_at }}" >> "$GITHUB_STEP_SUMMARY"
