name: Publish OrbitBid 2064 metadata

on:
  push:
    branches:
      - mirror-2064-temp

permissions:
  contents: write

jobs:
  publish-2064:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --upgrade curl_cffi

      - name: Fetch and write verified auction metadata
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import export_orbitbid as base

          ids = [
              1799681, 1799690, 1799689, 1799688, 1799687, 1799686, 1799685, 1799684,
              1799683, 1799682, 1799691, 1799692, 1799693, 1799694, 1799695, 1799696,
              1811448, 1799711, 1799697, 1799698, 1799699, 1799712, 1799700, 1799701,
              1799702, 1799703, 1799704, 1799705, 1799706, 1799708, 1799710, 1799709,
          ]
          expected_numbers = {
              "9860","9861","9862","9863","9864","9865","9866","9867","9868","9869",
              "9870","9871","9872","9873","9874","9875","3323","9853","9876","9877",
              "9878","9879","9880","9881","9882","9883","9884","9885","9886","9888",
              "9889","9890",
          }

          session = base.build_session()
          lots, errors = [], []
          for i, internal_id in enumerate(ids, 1):
              try:
                  lot = base.fetch_lot(session, internal_id)
                  lots.append(lot)
                  print(f"[{i}/{len(ids)}] {lot['requested_lot_number']} | {lot['photo_count']} photos")
              except Exception as exc:
                  errors.append({"internal_id": internal_id, "error": str(exc)})
                  print(f"ERROR {internal_id}: {exc}", file=sys.stderr)

          numbers = {str(x.get("requested_lot_number")) for x in lots}
          if errors or len(lots) != 32 or numbers != expected_numbers:
              raise SystemExit(
                  f"Validation failed: lots={len(lots)}, errors={errors}, "
                  f"missing={sorted(expected_numbers-numbers)}, extra={sorted(numbers-expected_numbers)}"
              )

          retrieved_at = datetime.now(timezone.utc).isoformat().replace("+00:00","Z")
          out = Path("auctions/2064")
          out.mkdir(parents=True, exist_ok=True)
          data = {
              "auction_id": 2064,
              "source_url": "https://bid.orbitbid.com/?auction_id=2064",
              "catalog_pages": ["https://bid.orbitbid.com/?auction_id=2064"],
              "retrieved_at": retrieved_at,
              "total_discovered": 32,
              "total_retrieved": 32,
              "total_errors": 0,
              "lots": lots,
              "errors": [],
          }
          (out / "lots.json").write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          (out / "summary.md").write_text(base.make_summary(data), encoding="utf-8")
          (out / "summary.csv").write_text(base.make_csv(lots), encoding="utf-8", newline="")
          base.append_price_history(out, retrieved_at, lots, "export")
          (out / "README.md").write_text(base.make_readme(data), encoding="utf-8")
          print(f"Verified 32 active lots; {sum(x['photo_count'] for x in lots)} source photos.")
          PY

      - name: Commit metadata to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auctions/2064/README.md auctions/2064/summary.md auctions/2064/summary.csv auctions/2064/lots.json auctions/2064/price-history.csv
          git commit -m "Import OrbitBid auction 2064 metadata"
          git push origin HEAD:main
