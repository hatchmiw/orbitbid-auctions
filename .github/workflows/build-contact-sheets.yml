name: Build auction contact sheets

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_contact_sheets.py"
      - ".github/workflows/build-contact-sheets.yml"
  workflow_dispatch:
    inputs:
      auction_id:
        description: "OrbitBid auction ID"
        required: true
        default: "1879"

permissions:
  contents: write

concurrency:
  group: orbitbid-metadata-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pillow
      - name: Build contact sheets
        run: python scripts/build_contact_sheets.py "${{ github.event.inputs.auction_id || '1879' }}"
      - name: Commit contact sheets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "auctions/${{ github.event.inputs.auction_id || '1879' }}/photos/*/review.jpg"
          if git diff --cached --quiet; then
            echo "No contact sheet changes."
          else
            git commit -m "Build auction ${{ github.event.inputs.auction_id || '1879' }} contact sheets"
            git push
          fi
