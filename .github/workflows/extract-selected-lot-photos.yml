name: Extract OrbitBid photo subset

on:
  workflow_dispatch:
    inputs:
      auction_id:
        description: Auction ID
        required: true
        default: '1879'
      lots:
        description: Space-separated lot numbers, or ALL
        required: true
        default: 'ALL'
      source_run_id:
        description: Workflow run containing full photo artifact
        required: true
        default: '36039298628'
      source_artifact:
        description: Full photo artifact name
        required: true
        default: 'orbitbid-1879-photos'
      mode:
        description: selected-originals or review-sheets
        required: true
        default: 'selected-originals'
  push:
    branches: [main]
    paths:
      - 'photo-requests/*.json'
      - '.github/workflows/extract-selected-lot-photos.yml'

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Resolve request
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            auction_id="${{ inputs.auction_id }}"
            lots="${{ inputs.lots }}"
            source_run_id="${{ inputs.source_run_id }}"
            source_artifact="${{ inputs.source_artifact }}"
            mode="${{ inputs.mode }}"
          else
            request_file="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'photo-requests/*.json' | head -n1)"
            if [[ -z "$request_file" ]]; then
              echo "No photo request file changed; nothing to do."
              exit 0
            fi
            auction_id="$(jq -r '.auction_id' "$request_file")"
            lots="$(jq -r 'if .lots == "ALL" then "ALL" else (.lots | join(" ")) end' "$request_file")"
            source_run_id="$(jq -r '.source_run_id' "$request_file")"
            source_artifact="$(jq -r '.source_artifact' "$request_file")"
            mode="$(jq -r '.mode // "selected-originals"' "$request_file")"
          fi

          [[ "$auction_id" =~ ^[0-9]+$ ]]
          [[ "$source_run_id" =~ ^[0-9]+$ ]]
          [[ "$mode" == "selected-originals" || "$mode" == "review-sheets" ]]

          echo "AUCTION_ID=$auction_id" >> "$GITHUB_ENV"
          echo "LOTS=$lots" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=$source_run_id" >> "$GITHUB_ENV"
          echo "SOURCE_ARTIFACT=$source_artifact" >> "$GITHUB_ENV"
          echo "MODE=$mode" >> "$GITHUB_ENV"

          if [[ "$mode" == "review-sheets" ]]; then
            echo "OUTPUT_ARTIFACT=orbitbid-$auction_id-review-sheets" >> "$GITHUB_ENV"
          else
            echo "OUTPUT_ARTIFACT=orbitbid-$auction_id-selected-source-photos" >> "$GITHUB_ENV"
          fi

      - name: Download existing full-auction artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/orbitbid-source
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir /tmp/orbitbid-source

      - name: Extract requested photo subset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/orbitbid-selected

          if [[ "$MODE" == "review-sheets" ]]; then
            if [[ -f /tmp/orbitbid-source/manifest.json ]]; then
              cp /tmp/orbitbid-source/manifest.json /tmp/orbitbid-selected/manifest.json
            fi
            while IFS= read -r sheet; do
              lot="$(basename "$(dirname "$sheet")")"
              mkdir -p "/tmp/orbitbid-selected/$lot"
              cp "$sheet" "/tmp/orbitbid-selected/$lot/review.jpg"
            done < <(find /tmp/orbitbid-source -mindepth 2 -maxdepth 2 -type f -name review.jpg | sort)

            count="$(find /tmp/orbitbid-selected -type f -name review.jpg | wc -l)"
            if (( count == 0 )); then
              echo "No review sheets found in source artifact." >&2
              exit 1
            fi
            echo "Extracted $count review sheets."
          else
            if [[ "$LOTS" == "ALL" ]]; then
              echo "ALL is not allowed for selected-originals mode." >&2
              exit 1
            fi
            for lot in $LOTS; do
              test -d "/tmp/orbitbid-source/$lot"
              cp -a "/tmp/orbitbid-source/$lot" "/tmp/orbitbid-selected/$lot"
            done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_ARTIFACT }}
          path: /tmp/orbitbid-selected/
          retention-days: 9
          compression-level: 0
          if-no-files-found: error

      - name: Record selected-originals artifact
        if: env.MODE == 'selected-originals'
        shell: bash
        run: |
          set -euo pipefail
          marker="auctions/$AUCTION_ID/selected-photo-artifact-run.txt"
          printf 'run_id=%s\nlots=%s\nartifact=%s\n' "$GITHUB_RUN_ID" "$LOTS" "$OUTPUT_ARTIFACT" > "$marker"
          git config user.name "github-actions[bot]"
          git config user.email "41898218+github-actions[bot]@users.noreply.github.com"
          git add "$marker"
          git commit -m "Record selected OrbitBid photo artifact" || exit 0
          git pull --rebase origin main
          git push
