name: Extract selected OrbitBid lot photos
on:
  workflow_dispatch:
    inputs:
      auction_id:
        description: Auction ID
        required: true
        default: '1879'
      lots:
        description: Space-separated lot numbers
        required: true
        default: '18115 18530 18573 18577 18468 18156 18189 18193 18206 18440 18501 18544 18545'
      source_run_id:
        description: Workflow run containing full photo artifact
        required: true
        default: '36039298628'
      source_artifact:
        description: Full photo artifact name
        required: true
        default: 'orbitbid-1879-photos'
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-selected-lot-photos.yml
permissions:
  actions: read
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve selection
        shell: bash
        run: |
          set -euo pipefail
          echo "AUCTION_ID=${{ github.event.inputs.auction_id || '1879' }}" >> "$GITHUB_ENV"
          echo "LOTS=${{ github.event.inputs.lots || '18115 18530 18573 18577 18468 18156 18189 18193 18206 18440 18501 18544 18545' }}" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=${{ github.event.inputs.source_run_id || '36039298628' }}" >> "$GITHUB_ENV"
          echo "SOURCE_ARTIFACT=${{ github.event.inputs.source_artifact || 'orbitbid-1879-photos' }}" >> "$GITHUB_ENV"
      - name: Download existing full-auction artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/orbitbid-source
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir /tmp/orbitbid-source
      - name: Extract selected lots only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/orbitbid-selected
          for lot in $LOTS; do
            test -d "/tmp/orbitbid-source/$lot"
            cp -a "/tmp/orbitbid-source/$lot" "/tmp/orbitbid-selected/$lot"
          done
          find /tmp/orbitbid-selected -maxdepth 2 -type f -print | sort
      - uses: actions/upload-artifact@v4
        with:
          name: orbitbid-${{ env.AUCTION_ID }}-shortlist-source-photos
          path: /tmp/orbitbid-selected/
          retention-days: 9
          compression-level: 0
      - name: Record extractor run ID
        shell: bash
        run: |
          set -euo pipefail
          marker="auctions/$AUCTION_ID/selected-photo-artifact-run.txt"
          printf 'run_id=%s\nlots=%s\nartifact=orbitbid-%s-shortlist-source-photos\n' "$GITHUB_RUN_ID" "$LOTS" "$AUCTION_ID" > "$marker"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$marker"
          git commit -m "Record shortlist photo artifact run" || exit 0
          git push
