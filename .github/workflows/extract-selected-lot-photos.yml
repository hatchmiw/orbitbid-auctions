name: Extract selected OrbitBid lot photos
on:
  workflow_dispatch:
    inputs:
      auction_id:
        description: Auction ID
        required: true
        default: '1879'
      lot:
        description: Lot number
        required: true
        default: '18211'
      source_run_id:
        description: Workflow run containing full photo artifact
        required: true
        default: '36039298628'
      source_artifact:
        description: Full photo artifact name
        required: true
        default: 'orbitbid-1879-photos'
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-selected-lot-photos.yml
permissions:
  actions: read
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve selection
        shell: bash
        run: |
          set -euo pipefail
          echo "AUCTION_ID=${{ github.event.inputs.auction_id || '1879' }}" >> "$GITHUB_ENV"
          echo "LOT=${{ github.event.inputs.lot || '18211' }}" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=${{ github.event.inputs.source_run_id || '36039298628' }}" >> "$GITHUB_ENV"
          echo "SOURCE_ARTIFACT=${{ github.event.inputs.source_artifact || 'orbitbid-1879-photos' }}" >> "$GITHUB_ENV"
      - name: Download existing full-auction artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/orbitbid-source
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir /tmp/orbitbid-source
          test -d "/tmp/orbitbid-source/$LOT"
      - name: Extract selected lot only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/orbitbid-selected
          cp -a "/tmp/orbitbid-source/$LOT" "/tmp/orbitbid-selected/$LOT"
          find "/tmp/orbitbid-selected/$LOT" -maxdepth 1 -type f -print | sort
      - uses: actions/upload-artifact@v4
        with:
          name: orbitbid-${{ env.AUCTION_ID }}-lot-${{ env.LOT }}-source-photos
          path: /tmp/orbitbid-selected/
          retention-days: 9
          compression-level: 0
