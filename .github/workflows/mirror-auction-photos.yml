name: Mirror auction photos

on:
  workflow_dispatch:
    inputs:
      auction_id:
        description: "OrbitBid auction ID"
        required: true
        default: "1970"

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Test auction photo checks
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Calculate photo retention
        id: retention
        shell: bash
        run: python scripts/photo_retention.py "${{ inputs.auction_id }}" >> "$GITHUB_OUTPUT"

      - name: Mirror photos
        if: steps.retention.outputs.expired != 'true'
        run: python scripts/mirror_photos.py "${{ inputs.auction_id }}"

      - name: Build review sheets
        if: steps.retention.outputs.expired != 'true'
        run: python scripts/build_contact_sheets.py "${{ inputs.auction_id }}"

      - name: Verify photo outputs
        if: steps.retention.outputs.expired != 'true'
        run: python scripts/verify_photo_outputs.py "${{ inputs.auction_id }}"

      - name: Upload temporary photo archive
        if: steps.retention.outputs.expired != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orbitbid-${{ inputs.auction_id }}-photos
          path: auctions/${{ inputs.auction_id }}/photos/
          retention-days: ${{ steps.retention.outputs.retention_days }}
          compression-level: 0
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          echo "Temporary OrbitBid photo/review artifact created for auction ${{ inputs.auction_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Delete after (UTC): ${{ steps.retention.outputs.cleanup_at }}" >> "$GITHUB_STEP_SUMMARY"
