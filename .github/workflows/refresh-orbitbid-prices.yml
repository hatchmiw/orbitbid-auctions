name: Refresh OrbitBid prices

on:
  workflow_dispatch:
    inputs:
      auction_id:
        description: "Saved OrbitBid auction ID"
        required: true
        default: "1970"

permissions:
  contents: write

concurrency:
  group: orbitbid-refresh-${{ inputs.auction_id }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --upgrade curl_cffi

      - name: Refresh saved lot prices
        run: python scripts/refresh_orbitbid.py "${{ inputs.auction_id }}"

      - name: Commit refreshed metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "auctions/${{ inputs.auction_id }}/README.md" \
                  "auctions/${{ inputs.auction_id }}/summary.md" \
                  "auctions/${{ inputs.auction_id }}/summary.csv" \
                  "auctions/${{ inputs.auction_id }}/lots.json"

          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "Refresh OrbitBid auction ${{ inputs.auction_id }} prices"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 5
            done
            exit 1
          fi
