name: Refresh OrbitBid prices

on:
  workflow_dispatch:
    inputs:
      auction_id:
        description: "Saved OrbitBid auction ID"
        required: true
        default: "1879"
  schedule:
    # Hourly baseline for every saved auction that has not passed its cutoff.
    # Offset from :00 to reduce GitHub Actions schedule congestion.
    - cron: "7 * * * *"
    # Together with :07 above, these provide a 10-minute cadence on auction
    # day and throughout the six-hour post-close grace period.
    - cron: "17,27,37,47,57 * * * *"

permissions:
  contents: write

# Use one shared lock for workflows that write auction metadata.
concurrency:
  group: orbitbid-metadata-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --upgrade curl_cffi

      - name: Select auctions for this run
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_AUCTION_ID: ${{ inputs.auction_id }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' "$MANUAL_AUCTION_ID" > /tmp/orbitbid-auctions.txt
          elif [[ "$SCHEDULE" == "7 * * * *" ]]; then
            python scripts/select_price_refresh_auctions.py hourly > /tmp/orbitbid-auctions.txt
          else
            python scripts/select_price_refresh_auctions.py auction-day > /tmp/orbitbid-auctions.txt
          fi

          echo "Selected auctions:"
          cat /tmp/orbitbid-auctions.txt || true

          if [[ -s /tmp/orbitbid-auctions.txt ]]; then
            echo "has_auctions=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_auctions=false" >> "$GITHUB_OUTPUT"
            echo "No OrbitBid auctions need a price refresh on this run."
          fi

      - name: Refresh selected auctions and publish safely
        if: steps.select.outputs.has_auctions == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r auction_id; do
            [[ -n "$auction_id" ]] || continue
            echo "Refreshing OrbitBid auction $auction_id"

            published=false
            for attempt in 1 2 3; do
              echo "Refresh/publish attempt $attempt of 3 for auction $auction_id"
              git fetch origin main
              git reset --hard origin/main

              python scripts/refresh_orbitbid.py "$auction_id"

              git add -- "auctions/$auction_id/README.md" \
                         "auctions/$auction_id/summary.md" \
                         "auctions/$auction_id/summary.csv" \
                         "auctions/$auction_id/lots.json" \
                         "auctions/$auction_id/price-history.csv"

              if git diff --cached --quiet; then
                echo "No changes to publish for auction $auction_id."
                published=true
                break
              fi

              git commit -m "Refresh OrbitBid auction $auction_id prices"
              if git push origin HEAD:main; then
                echo "Published auction $auction_id prices and history successfully."
                published=true
                break
              fi

              echo "Main changed during publish or push failed. Retrying from latest main."
              sleep $((attempt * 5))
            done

            if [[ "$published" != "true" ]]; then
              echo "Unable to publish auction $auction_id prices after 3 attempts." >&2
              exit 1
            fi
          done < /tmp/orbitbid-auctions.txt
