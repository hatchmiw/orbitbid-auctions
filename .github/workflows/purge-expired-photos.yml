name: Purge expired OrbitBid photos

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: orbitbid-metadata-writes
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Find auctions past closing plus seven days
        shell: bash
        run: |
          python scripts/photo_retention.py --due > /tmp/expired-auctions.txt
          echo "Expired OrbitBid auction IDs:"
          cat /tmp/expired-auctions.txt

      - name: Delete expired photo artifacts and legacy folders
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r auction_id; do
            [[ -n "$auction_id" ]] || continue
            echo "Checking expired auction $auction_id"

            gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" |
            jq -r --arg auction_id "$auction_id" '
              .artifacts[]
              | select(
                  .name == ("orbitbid-" + $auction_id + "-photos")
                  or .name == ("orbitbid-" + $auction_id + "-review-photos")
                  or .name == ("orbitbid-" + $auction_id + "-review-sheets")
                  or (.name | startswith("orbitbid-" + $auction_id + "-photos-"))
                )
              | .id
            ' |
            while IFS= read -r artifact_id; do
              [[ -n "$artifact_id" ]] || continue
              echo "Deleting artifact $artifact_id for auction $auction_id"
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            done

            if [[ -d "auctions/$auction_id/photos" ]]; then
              echo "Removing legacy committed photo folder for auction $auction_id"
              git rm -r -q "auctions/$auction_id/photos"
            fi
          done < /tmp/expired-auctions.txt

          if git diff --cached --quiet; then
            echo "No legacy committed photo folders to remove."
          else
            git commit -m "Purge expired OrbitBid auction photos"
            git pull --rebase origin main
            git push
          fi
