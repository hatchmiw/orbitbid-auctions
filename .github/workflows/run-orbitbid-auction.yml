      - name: Upload original-photo shard 019
        if: steps.retention.outputs.expired != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orbitbid-${{ inputs.auction_id }}-photos-019
          path: .artifact-staging/${{ inputs.auction_id }}/photos-019/
          retention-days: ${{ steps.retention.outputs.retention_days }}
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload original-photo shard 020
        if: steps.retention.outputs.expired != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orbitbid-${{ inputs.auction_id }}-photos-020
          path: .artifact-staging/${{ inputs.auction_id }}/photos-020/
          retention-days: ${{ steps.retention.outputs.retention_days }}
          compression-level: 0
          if-no-files-found: ignore

      - name: Delete superseded monolithic photo artifacts
        if: steps.retention.outputs.expired != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          legacy_name="orbitbid-${{ inputs.auction_id }}-photos"
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$legacy_name&per_page=100" --jq '.artifacts[].id' |
          while IFS= read -r artifact_id; do
            [[ -n "$artifact_id" ]] || continue
            echo "Deleting superseded monolithic artifact $artifact_id ($legacy_name)"
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done

      - name: Remove temporary photo workspace
        if: always()
        shell: bash
        run: |
          rm -rf "auctions/${{ inputs.auction_id }}/photos"
          rm -rf ".artifact-staging/${{ inputs.auction_id }}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## OrbitBid auction ${{ inputs.auction_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Permanent: metadata and photo-artifact index only." >> "$GITHUB_STEP_SUMMARY"
          echo "Temporary: review sheets and sharded source-photo artifacts." >> "$GITHUB_STEP_SUMMARY"
          echo "Target shard size: 275 MiB; hard shard ceiling: 450 MiB." >> "$GITHUB_STEP_SUMMARY"
          echo "Photo cleanup after (UTC): ${{ steps.retention.outputs.cleanup_at }}" >> "$GITHUB_STEP_SUMMARY"
