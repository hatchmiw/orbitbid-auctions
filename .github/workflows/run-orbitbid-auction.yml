name: Run OrbitBid Auction

on:
  workflow_dispatch:
    inputs:
      auction_id:
        description: "OrbitBid auction ID"
        required: true
        default: "1879"

permissions:
  contents: write
  actions: write

concurrency:
  group: orbitbid-metadata-writes
  cancel-in-progress: false

jobs:
  run-auction:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade curl_cffi pillow

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Export OrbitBid auction
        run: python scripts/export_orbitbid_direct.py "${{ inputs.auction_id }}"

      - name: Verify exported metadata
        shell: bash
        run: |
          set -euo pipefail
          for name in README.md summary.md summary.csv lots.json price-history.csv; do
            test -s "auctions/${{ inputs.auction_id }}/$name"
          done
          python - "${{ inputs.auction_id }}" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path("auctions") / sys.argv[1] / "lots.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          lots = data.get("lots", [])
          count = data.get("total_discovered")
          if not lots or len(lots) != count or data.get("total_errors"):
              raise SystemExit(f"Incomplete export: {len(lots)} retrieved, {count} discovered, {data.get('total_errors')} errors")
          print(f"Verified {len(lots)} retrieved auction lots.")
          PY

      - name: Commit permanent auction metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "auctions/${{ inputs.auction_id }}/README.md" \
                  "auctions/${{ inputs.auction_id }}/summary.md" \
                  "auctions/${{ inputs.auction_id }}/summary.csv" \
                  "auctions/${{ inputs.auction_id }}/lots.json" \
                  "auctions/${{ inputs.auction_id }}/price-history.csv"

          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
          else
            git commit -m "Run OrbitBid auction ${{ inputs.auction_id }}"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Auction metadata committed and pushed."
                break
              fi
              if [[ "$attempt" == "3" ]]; then
                echo "Failed to push after 3 attempts." >&2
                exit 1
              fi
              sleep 5
            done
          fi

      - name: Calculate temporary photo retention
        id: retention
        shell: bash
        run: python scripts/photo_retention.py "${{ inputs.auction_id }}" >> "$GITHUB_OUTPUT"

      - name: Mirror lot photos into temporary runner workspace
        if: steps.retention.outputs.expired != 'true'
        run: python scripts/mirror_photos.py "${{ inputs.auction_id }}"

      - name: Build review sheets
        if: steps.retention.outputs.expired != 'true'
        run: python scripts/build_contact_sheets.py "${{ inputs.auction_id }}"

      - name: Verify photo outputs
        if: steps.retention.outputs.expired != 'true'
        run: python scripts/verify_photo_outputs.py "${{ inputs.auction_id }}"

      - name: Partition temporary photo artifacts
        if: steps.retention.outputs.expired != 'true'
        shell: bash
        run: |
          python scripts/partition_photo_artifacts.py "${{ inputs.auction_id }}" \
            --target-mib 275 \
            --hard-max-mib 450 \
            --run-id "$GITHUB_RUN_ID" \
            --cleanup-at "${{ steps.retention.outputs.cleanup_at }}"

      - name: Commit photo artifact index only
        if: steps.retention.outputs.expired != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          index="auctions/${{ inputs.auction_id }}/photo-artifact-index.json"
          test -s "$index"
          git add -- "$index"

          if git diff --cached --quiet; then
            echo "Photo artifact index already current."
          else
            git commit -m "Index OrbitBid ${{ inputs.auction_id }} temporary photo artifacts"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Photo artifact index committed and pushed."
                break
              fi
              if [[ "$attempt" == "3" ]]; then
                echo "Failed to publish artifact index after 3 attempts." >&2
                exit 1
              fi
              sleep 5
            done
          fi

      - name: Upload all-lot review sheets
        if: steps.retention.outputs.expired != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orbitbid-${{ inputs.auction_id }}-review-sheets
          path: .artifact-staging/${{ inputs.auction_id }}/review-sheets/
          retention-days: ${{ steps.retention.outputs.retention_days }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload original-photo shard 001
        if: steps.retention.outputs.expired != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orbitbid-${{ inputs.auction_id }}-photos-001
          path: .artifact-staging/${{ inputs.auction_id }}/photos-001/
          retention-days: ${{ steps.retention.outputs.retention_days }}
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload original-photo shard 002
        if: steps.retention.outputs.expired != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orbitbid-${{ inputs.auction_id }}-photos-002
          path: .artifact-staging/${{ inputs.auction_id }}/photos-002/
          retention-days: ${{ steps.retention.outputs.retention_days }}
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload original-photo shard 003
        if: steps.retention.outputs.expired != 'true'
