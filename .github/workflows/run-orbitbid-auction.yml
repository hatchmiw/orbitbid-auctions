        with:
          name: orbitbid-${{ inputs.auction_id }}-photos-003
          path: .artifact-staging/${{ inputs.auction_id }}/photos-003/
          retention-days: ${{ steps.retention.outputs.retention_days }}
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload original-photo shard 004
        if: steps.retention.outputs.expired != 'true'
