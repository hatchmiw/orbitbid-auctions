      - name: Upload original-photo shard 011
        if: steps.retention.outputs.expired != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orbitbid-${{ inputs.auction_id }}-photos-011
          path: .artifact-staging/${{ inputs.auction_id }}/photos-011/
          retention-days: ${{ steps.retention.outputs.retention_days }}
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload original-photo shard 012
        if: steps.retention.outputs.expired != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orbitbid-${{ inputs.auction_id }}-photos-012
          path: .artifact-staging/${{ inputs.auction_id }}/photos-012/
          retention-days: ${{ steps.retention.outputs.retention_days }}
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload original-photo shard 013
        if: steps.retention.outputs.expired != 'true'
