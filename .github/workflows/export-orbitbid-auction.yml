name: Export OrbitBid auction

on:
  workflow_dispatch:
    inputs:
      auction_id:
        description: "OrbitBid auction ID"
        required: true
        default: "1879"

permissions:
  contents: write

concurrency:
  group: orbitbid-metadata-writes
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade curl_cffi playwright
          python -m playwright install --with-deps chromium

      - name: Export OrbitBid auction
        run: python scripts/export_orbitbid_rendered.py "${{ inputs.auction_id }}"

      - name: Commit auction snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "auctions/${{ inputs.auction_id }}/README.md" \
                  "auctions/${{ inputs.auction_id }}/summary.md" \
                  "auctions/${{ inputs.auction_id }}/summary.csv" \
                  "auctions/${{ inputs.auction_id }}/lots.json" \
                  "auctions/${{ inputs.auction_id }}/price-history.csv"

          if git diff --cached --quiet; then
            echo "No auction changes to commit."
          else
            git commit -m "Export OrbitBid auction ${{ inputs.auction_id }}"
            git push
          fi
