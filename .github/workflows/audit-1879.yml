name: Audit OrbitBid 1879 review integrity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'auctions/1879/catalog-review.csv'
      - 'scripts/audit_1879.py'
      - 'scripts/build_auction_review.py'
      - '.github/workflows/audit-1879.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate master and evidence gates
        run: python scripts/build_auction_review.py 1879 --check
      - name: Audit exact completion state
        run: python scripts/audit_1879.py | tee "$GITHUB_STEP_SUMMARY"
